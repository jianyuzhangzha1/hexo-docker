services:
  hexo-dev:
    image: node:22-alpine
    container_name: hexo-dev
    working_dir: /app
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./blog:/app
      - npm_cache:/root/.npm
    environment:
      - TZ=Asia/Shanghai
    command: sh -c "npm install && npx hexo server -i 0.0.0.0"

volumes:
  npm_cache:
